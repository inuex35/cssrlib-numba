[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "cssrlib"
version = "1.2.1"
description = "Python Toolkit for PPP/PPP-RTK positioning"
authors = [
    {name="Rui Hirokawa", email="rui.hirokawa@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitstruct",
    "galois",
    "numpy",
    "numba",
    # Nothing imports scipy directly, but Numba's np.linalg support binds to
    # SciPy's BLAS/LAPACK at runtime; without it the njit'd geodist aborts
    # with "Specified LAPACK function could not be found".
    "scipy",
    "matplotlib",
]
