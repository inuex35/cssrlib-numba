name: notebook-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gtsam-rtk-notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System deps for the prebuilt GTSAM wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization1.83.0 libboost-timer1.83.0

      - name: Install GTSAM (prebuilt custom wheel with DD/NHC/FLS)
        run: |
          pip install https://github.com/inuex35/gtsam/releases/download/wheel-nhc-cp312-ubuntu2404/gtsam-4.3a1-cp312-cp312-linux_x86_64.whl

      - name: Install cssrlib + notebook tooling
        run: |
          pip install -e .
          pip install jupyter nbconvert ipykernel

      - name: Execute gtsam_rtk notebook
        working-directory: examples
        run: |
          jupyter nbconvert --to notebook --execute gtsam_rtk.ipynb \
            --output executed_rtk.ipynb --ExecutePreprocessor.timeout=900

      - name: Check RTK metrics
        run: |
          python ci/check_gnss_notebook.py examples/executed_rtk.ipynb \
            --fix3d-max 0.05 --min-amb 20 --float3d-max 0.5

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-rtk-notebook
          path: examples/executed_rtk.ipynb

  gtsam-ppprtk-notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System deps for the prebuilt GTSAM wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization1.83.0 libboost-timer1.83.0

      - name: Install GTSAM (develop wheel with Undifferenced + DD factors)
        run: |
          pip install https://github.com/inuex35/gtsam/releases/download/wheel-develop-cp312-ubuntu2404/gtsam-4.3a1-cp312-cp312-linux_x86_64.whl

      - name: Install cssrlib + notebook tooling
        run: |
          pip install -e .
          pip install jupyter nbconvert ipykernel

      - name: Cache cssrlib-data subset
        id: data-cache
        uses: actions/cache@v4
        with:
          path: cssrlib-data
          key: cssrlib-data-doy2025-233-v1

      - name: Fetch cssrlib-data (sparse, doy2025-233 + grid) + IGS antex
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/hirokawa/cssrlib-data
          cd cssrlib-data
          git sparse-checkout set --no-cone \
            '/data/doy2025-233/*' '/data/clas_grid.def'
          # igs20.atx is no longer tracked upstream; take it from IGS.
          mkdir -p data/antex
          curl -fsSL -o data/antex/igs20.atx \
            https://files.igs.org/pub/station/general/igs20.atx

      - name: Execute gtsam_ppprtk notebook
        working-directory: examples
        env:
          CSSRLIB_DATA: ${{ github.workspace }}/cssrlib-data/data
        run: |
          jupyter nbconvert --to notebook --execute gtsam_ppprtk.ipynb \
            --output executed_ppprtk.ipynb --ExecutePreprocessor.timeout=900

      - name: Check PPP-RTK metrics
        run: |
          python ci/check_gnss_notebook.py examples/executed_ppprtk.ipynb \
            --fix3d-max 0.15 --min-amb 15 --float3d-max 1.0

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-ppprtk-notebook
          path: examples/executed_ppprtk.ipynb
