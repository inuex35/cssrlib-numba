name: tests

# Runs on every push and pull request. It previously fired only on `main`
# and `devel`: `devel` does not exist in this repository and `main` has been
# stale since 2025-11, so this workflow had never run on an active branch.
# That is how 20c0df1 reverted 18 Numba kernels and broke four code paths
# without anything objecting.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install from requirements.txt alone, so a dependency that is
      # declared but missing -- or needed but undeclared -- fails here.
      # numba was an undeclared hard import for four modules, and scipy is
      # required at runtime by numba's np.linalg even though nothing
      # imports it.
      - name: Install declared dependencies
        run: pip install -r requirements.txt

      - name: Install cssrlib
        run: pip install --no-deps .

      # Catches a distribution that installs no code: src/cssrlib had no
      # __init__.py, so `packages = find:` discovered nothing and a
      # non-editable install produced an empty package.
      - name: Verify the installed distribution imports, from outside the repo
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib, pkgutil, cssrlib
          # every module in every layer
          found = [m.name for m in pkgutil.walk_packages(
              cssrlib.__path__, cssrlib.__name__ + '.')]
          for name in found:
              importlib.import_module(name)
          # the names that predate the package layout
          legacy = ['gnss', 'rinex', 'peph', 'ephemeris', 'orbit', 'glonass',
                    'mlambda', 'geometry', 'gnssobs', 'rtk', 'ppprtk',
                    'atmosphere', 'constants', 'ppp', 'cssrlib', 'cssr_bds',
                    'cssr_has', 'cssr_mdc', 'cssr_pvs']
          for name in legacy:
              importlib.import_module('cssrlib.' + name)
          print(f'{len(found)} modules, {len(legacy)} legacy names, all import')
          PY

      - name: Run tests
        run: pip install pytest && pytest src/cssrlib/test -q

  upstream-map:
    name: upstream map is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The baseline is a pinned upstream commit; a default checkout has
      # only the PR head, so fetch it from the upstream repo by SHA --
      # this works from any fork's clone.
      - name: Fetch the pinned upstream baseline
        run: |
          sha=$(python -c "import re;print(re.search(r'DEFAULT_UPSTREAM = \"([0-9a-f]{40})\"', open('ci/upstream_map.py').read()).group(1))")
          git fetch --depth=1 https://github.com/hirokawa/cssrlib.git "$sha"

      - run: python ci/upstream_map.py --check

  examples:
    name: examples import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt && pip install --no-deps .

      # The PPP/PPP-RTK examples are the only remaining callers of
      # gnssobs.process; the GTSAM ones need gtsam and are covered by
      # notebook-ci.yml instead.
      - name: Check the PPP examples still resolve their imports
        run: |
          python - <<'PY'
          import ast, importlib, sys
          failed = False
          for path in ('examples/ppp_has.py', 'examples/ppp_bds.py',
                       'examples/ppprtk_clas.py'):
              tree = ast.parse(open(path).read())
              mods = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods |= {a.name.split('.')[0] for a in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      mods.add(node.module.split('.')[0])
              missing = []
              for m in sorted(mods):
                  try:
                      importlib.import_module(m)
                  except ImportError:
                      missing.append(m)
              print(f'{path}: {missing or "ok"}')
              failed |= bool(missing)
          sys.exit(1 if failed else 0)
          PY
